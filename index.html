<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Quran Player</title>
		<link rel="icon" href="icon.png" type="image/png">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header id="topbar">
			<button class="icon-btn" id="burger-btn"><img src="icons/menu.svg" alt="Menu"></button>
			<button class="icon-btn" id="lang-switch"><img src="icons/language.svg" alt="Lang"></button>
		</header>
		
		<aside id="sidebar">
			<h2>Reciters</h2>
			<ul id="reciters-list"></ul>
		</aside>
		
		<main id="main-content">
			<div id="content">
				<h2 id="reciter-name">Select a reciter</h2>
				<div id="suwar-list"></div>
			</div>
		</main>
		
		<div id="player-bar">
			<div id="player-progress">
				<span id="time-current">00:00</span>
				<input type="range" id="seek-bar" value="0" step="0.1">
				<span id="time-total">00:00</span>
			</div>
			<div id="player-info">
				<span id="player-title">No current playback</span>
			</div>
			<div id="player-controls">
				<button class="icon-btn" id="btn-repeat"><img src="icons/repeat_off.svg" alt="Repeat"></button>
				<button class="icon-btn" id="btn-prev"><img src="icons/skip_left.svg" alt="Previous"></button>
				<button class="icon-btn" id="btn-rewind"><img src="icons/seek_left.svg" alt="Rewind"></button>
				<button class="icon-btn" id="btn-play"><img src="icons/play.svg" alt="Play"></button>
				<button class="icon-btn" id="btn-forward"><img src="icons/seek_right.svg" alt="Forward"></button>
				<button class="icon-btn" id="btn-next"><img src="icons/skip_right.svg" alt="Next"></button>
				<button class="icon-btn" id="btn-stop"><img src="icons/stop.svg" alt="Stop"></button>
			</div>
			<div id="player-settings">
				<button id="btn-mute" class="icon-btn"><img src="icons/volume_up.svg" alt="Mute"></button>
				<input type="range" id="volume-bar" min="0" max="1" step="0.05" value="1">
				<button class="icon-btn" id="btn-speed"><img src="icons/speed_1x.svg" alt="Speed 1x"></button>
				<a id="btn-download" class="icon-btn" target="_blank" rel="noopener noreferrer" download>
					<img src="icons/download.svg" alt="Download">
				</a>
			</div>
			<audio id="global-audio"></audio>
		</div>
		
		<script type="module" src="script.js"></script>
	</body>
</html>
